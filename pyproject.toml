[build-system]
requires = ["hatchling>=1.27"]  # PEP 639: SPDX `license` + `license-files`
build-backend = "hatchling.build"

[project]
name = "gpumedic"
version = "0.1.0"
description = "A health check for GPU machines: what's wrong, what to check, and whether each GPU should keep taking work"
authors = [{ name = "Samarth Urs" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["gpu", "nvidia", "nvml", "xid", "ecc", "health-check", "hpc", "slurm", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/SamarthUrs18/gpumedic"
Source = "https://github.com/SamarthUrs18/gpumedic"
Issues = "https://github.com/SamarthUrs18/gpumedic/issues"
Changelog = "https://github.com/SamarthUrs18/gpumedic/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Needed only on machines with NVIDIA GPUs (e.g. a RunPod pod).
nvidia = ["nvidia-ml-py>=12.535"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
gpumedic = "gpumedic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpumedic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Optional[X] stays: on Python 3.9 `X | None` fails wherever annotations are evaluated (typing.get_type_hints).
ignore = ["UP045", "UP007"]
